syntax = "proto3";

package ondock.v1;

option csharp_namespace = "Ondock.Api.Grpc.V1";

import "Protos/ondock/v1/common.proto";

// Categories Service - for profile categories and vehicle data
service CategoriesService {
  // Get all profile categories
  rpc GetCategories(Empty) returns (GetCategoriesResponse);
  
  // Get subcategories for a category
  rpc GetSubCategories(GetSubCategoriesRequest) returns (GetSubCategoriesResponse);
  
  // Get all vehicle types
  rpc GetVehicleTypes(Empty) returns (GetVehicleTypesResponse);
  
  // Get all vehicle brands
  rpc GetVehicleBrands(Empty) returns (GetVehicleBrandsResponse);
}

message GetCategoriesResponse {
  repeated ProfileCategory categories = 1;
}

message ProfileCategory {
  string id = 1;
  string name = 2;
  string description = 3;
  string icon = 4;
  int32 sort_order = 5;
}

message GetSubCategoriesRequest {
  string category_id = 1;
}

message GetSubCategoriesResponse {
  repeated ProfileSubCategory sub_categories = 1;
}

message ProfileSubCategory {
  string id = 1;
  string category_id = 2;
  string name = 3;
  string description = 4;
  int32 sort_order = 5;
}

message GetVehicleTypesResponse {
  repeated VehicleType vehicle_types = 1;
}

message VehicleType {
  string id = 1;
  string name = 2;
  string description = 3;
  string icon = 4;
  bool is_other = 5;
  int32 sort_order = 6;
}

message GetVehicleBrandsResponse {
  repeated VehicleBrand vehicle_brands = 1;
}

message VehicleBrand {
  string id = 1;
  string name = 2;
  string logo_url = 3;
  bool is_other = 4;
  int32 sort_order = 5;
}
